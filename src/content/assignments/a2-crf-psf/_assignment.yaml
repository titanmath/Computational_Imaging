code: "A2"
titre: "Courbe de réponse et PSF"
resume: "Deux calibrations de ta propre chaîne d’imagerie : la courbe de réponse (CRF) du téléphone, qui rend ses pixels non linéaires, puis la PSF de la caméra sténopé de l’A1, mesurée par une source ponctuelle et par un bord incliné."
sortie: "1er octobre 2026"
rendu: "27 octobre 2026, 23 h 59 (KST)"
demo: "29 octobre 2026"
livrables:
  - "Un seul PDF <numéro étudiant>.pdf sur PLMS, avec les deux tâches (pénalité de retard : 1 % par heure)"
  - "Tâche 1, capture : photos et montage, tableau EXIF (temps de pose en s, ISO, ouverture)"
  - "Tâche 1, échantillonnage : positions marquées, taille des pixels ou patchs, sélection et alignement"
  - "Tâche 1, méthode : Debevec-Malik (ou une alternative), poids, lissage et normalisation"
  - "Tâche 1, résultats : les trois CRF directes R, G, B, axes étiquetés (exposition, valeur de pixel)"
  - "Tâche 1, validation et analyse d’erreur : facultatives, sans effet sur la note"
  - "Tâche 2, montage : géométrie, diamètre du trou, distances de la cible et de l’écran"
  - "Tâche 2, résultats : PSF 2D de la source ponctuelle, ESF du bord, PSF 1D issue du bord"
  - "Tâche 2, comparaison : source projetée en 1D et PSF du bord superposées, FWHM des deux et écart en pixels"
chapitresLies:
  - "06-hdr"
  - "05-calibration"
  - "01-lentilles"
  - "03-isp"
