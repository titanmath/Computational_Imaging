numero: 4
titre: "Perception visuelle"
sousTitre: "L’observateur fait partie du système"
resume: "Ce que l’œil humain peut réellement voir : l’œil comme système optique, la rétine, la couleur (cônes, métamérisme, CIE XYZ), les effets de contexte, la sensibilité au contraste et au temps, la profondeur, et les métriques de qualité perceptuelle."
objectifs:
  - "décrire l’œil comme un système optique et expliquer accommodation, myopie, hypermétropie"
