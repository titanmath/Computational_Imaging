  - "calculer une réponse de cône et expliquer le métamérisme"
  - "lire un diagramme de chromaticité CIE et définir XYZ et xy"
  - "définir contraste de Michelson, cycles par degré et sensibilité au contraste"
  - "expliquer le conflit vergence-accommodation et pourquoi MSE ≠ qualité perçue"
icone: oeil
source: 4_visual_perception_2026.pdf
